<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;

    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

.container{
    width: 400px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    color: white;
}

.option{
    display: flex;
    flex-direction: column;
    margin-top: 20px;
    gap: 10px;
}

h1{
    margin-bottom: 20px;
    text-align: center;
    font-size: 28px;
}

.inputs{
    display: flex;
    flex-direction: column;
    gap: 15px;
}

input{
    padding: 10px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    background: rgba(126, 117, 117, 0.308);
    color: white;
}

button{
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #00c6ff;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover{
    background: #0072ff;
    transform: translateY(-2px);
}

.result-box{
    margin-top: 35px;
    display: flex;
    gap: 10px;
}

#result{
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.15);
    font-size: 18px;
    color: white;
}

    .copy-btn{
    width: 80px;
}


    </style>
</head>
<body>
   
    <div class="container">
         <h1><marquee behavior="scroll" scrollamount="10">PASSWORD GENERATOR</marquee></h1>
         <div class="inputs">
            <input type="number" placeholder="Enter length of password" id="length">
            <button onclick="generatePassword()">Generate Password</button>
         </div>

         <div class="option">
            <label>
                <input type="checkbox" id="Uppercase"> Uppercase Letters
            </label>
            <label>
                <input type="checkbox" id="symbols"> Symbols
            </label>
            <label>
                <input type="checkbox" id="Numbers"> Numbers
            </label>
         </div>
       
       <div class="result-box">

        <div id="result">Your password...</div>

            <button class="copy-btn" onclick="copyPassword()">Copy</button>
        </div>

        <div class="strength" id="strength"></div>

    </div>
    </div>
    <script>
        function generatePassword(){
            const length=document.getElementById('length').value;
            const Uppercase=document.getElementById('Uppercase').checked;
            const symbols=document.getElementById('symbols').checked;
            const Numbers=document.getElementById('Numbers').checked;

            if(length <= 0){
                alert("Please enter a valid length for the password.");
                return;
            }

            let char="abcdefghijklmnopqrstuvwxyz";
            if(Uppercase){
                char+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            }
            if(symbols){
                char+="!@#$%^&*()_+";
            }
            if(Numbers){
                char+="0123456789";
            }

            let password = "";

        for(let i = 0; i < length; i++){
            let random =Math.floor(Math.random() * char.length);
            password += char[random];
        }
            document.getElementById('result').textContent=password;
            checkStrength(password);
        }

        function copyPassword(){
            const password=document.getElementById('result').textContent;
            navigator.clipboard.writeText(password);
            alert("Password copied to clipboard!");
        }

        function checkStrength(password){

    let strength =
        document.getElementById("strength");

    if(password.length < 14){

        strength.textContent = "Weak Password";
        strength.style.color = "red";

    }
    else if(password.length < 18){

        strength.textContent = "Medium Password";
        strength.style.color = "orange";

    }
    else{

        strength.textContent = "Strong Password";
        strength.style.color = "lightgreen";
    }
}


    </script>
</body>
</html>
